<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Página no encontrada | Ciberseguridad desde cero</title>

<style>
:root{--bg:#f5f7fa;--ink:#101828;--muted:#5b6777;--accent:#0f766e;--on-accent:#ffffff;color-scheme:light}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
main{max-width:520px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:14px;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{font-size:clamp(30px,6vw,44px);line-height:1.15;margin:8px 0 12px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;padding:12px 20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>

<h1>No encontramos esa página</h1>
