name: Actualizar noticias

on:
  schedule:
    - cron: '17 11 * * *'   # todos los días a las 06:17 en Colombia (UTC-5)
  workflow_dispatch:         # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write            # solo para guardar noticias/datos.json

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar feeds y generar noticias/datos.json
        run: node tools/actualizar-noticias.js

      - name: Guardar cambios si los hay
        run: |
          if [ -n "$(git status --porcelain noticias/datos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add noticias/datos.json
            git commit -m "Actualiza noticias"
            git push
          else
            echo "Sin cambios en las noticias."
          fi
