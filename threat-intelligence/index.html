<div class="seo-static">
<h1>undefined</h1>
<p>Esta ruta de nivel 2 te enseña a producir inteligencia de amenazas útil: desde el ciclo de inteligencia y las fuentes, pasando por indicadores de compromiso y análisis, hasta informes accionables para equipos técnicos y gerencia. Incluye temas, laboratorios y preguntas de repaso. Tu progreso y tus notas se guardan en tu navegador. Para usar el seguimiento interactivo necesitás activar JavaScript.</p>
<ul>
<li>Fase 1: Fundamentos de inteligencia (3–4 semanas)</li>
<li>Fase 2: Indicadores y análisis (5–6 semanas)</li>
<li>Fase 3: Inteligencia accionable e informes (4–5 semanas)</li>
</ul>
<p><a href="../">← Todas las rutas</a></p>

<script>
const R = {
phases:[
{id:'f1',n:'Fase 1',name:'Fundamentos de inteligencia',weeks:'3–4 semanas',
goal:`Entender qué es la inteligencia de amenazas, cómo se produce y qué marcos la organizan.`,
temas:[
{t:`Qué es threat intelligence`,c:`Es información sobre actores de amenaza, sus capacidades e intenciones, procesada para tomar decisiones. No es lo mismo que una lista de IoC: un IoC es un dato, la inteligencia es el contexto que explica qué significa ese dato para tu organización.`,p:[`<b>Estratégica:</b> tendencias y riesgos para la gerencia.`,`<b>Operativa:</b> campañas, objetivos y momentos de ataque.`,`<b>Táctica:</b> técnicas y herramientas (TTP).`,`<b>Técnica:</b> indicadores concretos como hashes, IP y dominios.`],q:[[`¿Cuál es la diferencia entre un IoC y la inteligencia de amenazas?`,`Un IoC es un dato aislado. La inteligencia es ese dato con contexto sobre el actor, su intención y lo que significa para la organización.`],[`¿Qué nivel de inteligencia sirve para decidir inversiones?`,`La estratégica, porque está orientada a la gerencia.`]]},
{t:`El ciclo de inteligencia`,c:`La inteligencia se produce en un ciclo que se repite: se definen los requisitos, se recolecta, se procesa, se analiza, se difunde y se recibe retroalimentación para ajustar el siguiente ciclo.`,p:[`<b>Requisitos:</b> qué necesita saber la organización (PIR, por ejemplo).`,`<b>Recolección y procesamiento:</b> reunir datos y convertirlos en algo analizable.`,`<b>Análisis y difusión:</b> interpretar y entregar a quien lo necesita, en el formato adecuado.`,`<b>Retroalimentación:</b> saber si la inteligencia fue útil para ajustar requisitos.`],q:[[`¿Qué son los PIR?`,`Priority Intelligence Requirements: preguntas prioritarias que la organización necesita responder.`],[`¿En qué etapa se evalúa si la inteligencia sirvió?`,`En la retroalimentación.`]]},
{t:`Tipos de fuentes y su confiabilidad`,c:`Las fuentes van desde información pública hasta datos internos. Cada una tiene un nivel distinto de confianza, y conviene evaluarla antes de usarla.`,p:[`<b>Abiertas (OSINT):</b> sitios, noticias, redes sociales y repositorios públicos.`,`<b>Comunidades y comparticiones:</b> ISAC y listas de intercambio entre organizaciones.`,`<b>Comerciales:</b> proveedores de feeds de amenazas.`,`<b>Internas:</b> logs, incidentes y telemetría propia.`,`Escala Admiralty: la fuente se califica de A (completamente confiable) a F (no evaluable), y la información de 1 (confirmada) a 6 (no evaluable).`],q:[[`¿Qué calificación Admiralty tiene una fuente completamente confiable que confirmó la información?`,`A1.`],[`¿Por qué evaluar la fuente antes de usarla?`,`Porque una fuente poco confiable puede llevar a conclusiones falsas o a decisiones costosas.`]]},
{t:`Actores de amenaza`,c:`Un actor es quien ejecuta el ataque. Entender su motivación y capacidad permite anticipar qué busca y cómo lo hace.`,p:[`<b>APT (amenazas persistentes avanzadas):</b> grupos con recursos y objetivos sostenidos, muchas veces estatales.`,`<b>Cibercriminales:</b> motivados por dinero, por ejemplo con ransomware.`,`<b>Hacktivistas:</b> motivados por causas políticas o sociales.`,`<b>Amenazas internas:</b> personas con acceso legítimo que actúan de forma indebida.`],q:[[`¿Qué motiva habitualmente a un cibercriminal?`,`El beneficio económico.`],[`¿Qué es una APT?`,`Una amenaza persistente avanzada: un grupo con recursos y objetivos sostenidos en el tiempo.`]]},
{t:`Marcos de referencia`,c:`Los marcos dan un vocabulario común para describir ataques y compararlos entre incidentes y organizaciones.`,p:[`<b>MITRE ATT&CK:</b> base de tácticas y técnicas observadas en ataques reales.`,`<b>Cyber Kill Chain (Lockheed Martin):</b> las fases de un ataque, desde el reconocimiento hasta la acción sobre objetivos.`,`<b>Diamond Model:</b> relaciona adversario, capacidad, infraestructura y víctima en cada evento.`],q:[[`¿Qué marco describe un ataque con cuatro vértices: adversario, capacidad, infraestructura y víctima?`,`El Diamond Model.`],[`¿Qué base de datos reúne tácticas y técnicas observadas?`,`MITRE ATT&CK.`]]},
{t:`Uso ético y legal de la información`,c:`La inteligencia se obtiene de fuentes públicas o autorizadas. Investigar un actor no justifica acceder a sistemas ajenos ni tratar datos personales sin base legal.`,p:[`No accedas a sistemas o cuentas de terceros, aunque la información parezca pública.`,`Los datos personales tienen protección legal: en Colombia aplica la Ley 1581 de 2012.`,`Compartí inteligencia con el nivel de sensibilidad adecuado (ver TLP en la Fase 3).`],q:[[`¿Acceder a un servidor de un atacante para obtener evidencia es válido?`,`No. Es un acceso no autorizado, aunque el propósito sea investigar.`],[`¿Qué ley colombiana regula la protección de datos personales?`,`La Ley 1581 de 2012.`]]}
],
labs:[
{t:`Explorar un pulso público en AlienVault OTX`,pasos:[`Creá una cuenta gratuita en otx.alienvault.com.`,`Abrí un pulso público de tu interés y revisá sus IoC y etiquetas.`,`Anotá qué tipo de actor describe y qué indicadores comparte.`]},
{t:`Mapear un grupo de amenaza en ATT&CK Navigator`,pasos:[`Abrí ATT&CK Navigator y buscá la página de un grupo de amenaza en attack.mitre.org.`,`Marcá sus técnicas en una capa nueva del Navigator.`,`Anotá cinco técnicas y explicá qué busca el actor con cada una.`]},
{t:`Evaluar fuentes con la escala Admiralty`,pasos:[`Elegí cinco fuentes de información sobre amenazas (de tu lectura o de OTX).`,`Asigná a cada una una calificación de A a F y de 1 a 6.`,`Justificá en una línea cada calificación.`]},
{t:`Redactar requisitos de inteligencia (PIR)`,pasos:[`Imaginá una empresa de servicios financieros ficticia en Colombia.`,`Escribí tres PIR, por ejemplo: ¿qué actores apuntan al sector?, ¿qué técnicas usan?`,`Para cada PIR, anotá qué fuente te ayudaría a responderla.`]}
],
herr:[
['MITRE ATT&CK','Tácticas, técnicas y grupos de amenaza.','https://attack.mitre.org','Sitio oficial'],
['ATT&CK Navigator','Visualizar técnicas en capas de cobertura.','https://mitre-attack.github.io/attack-navigator/','Sitio oficial'],
['AlienVault OTX','Pulsos de inteligencia compartidos por la comunidad.','https://otx.alienvault.com','Sitio oficial'],
['MISP','Plataforma de intercambio de inteligencia de código abierto.','https://www.misp-project.org','Sitio oficial'],
['CISA Cybersecurity Advisories','Alertas y avisos de agencias públicas.','https://www.cisa.gov/news-events/cybersecurity-advisories','Sitio oficial'],
['Cyber Kill Chain','Modelo de fases de un ataque.','https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html','Sitio del fabricante']
],
recursos:[['MITRE ATT&CK','Base de conocimiento de tácticas y técnicas','https://attack.mitre.org'],['FIRST: TLP','Definición oficial del protocolo de semáforo','https://www.first.org/tlp'],['Admiralty code','Referencia de calificación de fuentes e información','https://en.wikipedia.org/wiki/Admiralty_code']]},

{id:'f2',n:'Fase 2',name:'Indicadores y análisis',weeks:'5–6 semanas',
goal:`Partir de un indicador, pivotear hacia la infraestructura relacionada y agrupar incidentes en campañas.`,
temas:[
{t:`Tipos de indicadores: la pirámide del dolor`,c:`No todos los indicadores tienen el mismo valor. Cambiar un hash es fácil para el atacante; cambiar sus técnicas le cuesta mucho más. Por eso la inteligencia útil se enfoca en comportamientos.`,p:[`<b>Bajo costo para el atacante:</b> hashes, IP y dominios.`,`<b>Mayor costo:</b> herramientas, técnicas y procedimientos (TTP).`,`Los IoC tienen vida corta; los TTP duran más y aportan más valor a la detección.`],q:[[`¿Qué indicador le cuesta más cambiar al atacante?`,`Las TTP, porque implican cambiar su forma de operar.`],[`¿Por qué un hash tiene poca vida útil como indicador?`,`Porque cambiar un byte del archivo genera un hash distinto.`]]},
{t:`Pivoteo desde un indicador`,c:`Pivotear es partir de un dato conocido para encontrar infraestructura relacionada: otros dominios, IP o certificados que comparten el mismo operador.`,p:[`DNS pasivo: historial de qué IP resolvió un dominio.`,`Certificados TLS: otros dominios emitidos con datos similares.`,`Registro WHOIS y el ASN de la IP.`,`Cada pivote debe documentarse con la evidencia que lo justifica.`],q:[[`¿Qué es el DNS pasivo?`,`El historial de qué IP ha resuelto un dominio a lo largo del tiempo.`],[`¿Qué fuente revela certificados emitidos para un dominio?`,`Los registros de transparencia de certificados, por ejemplo crt.sh.`]]},
{t:`Herramientas de consulta`,c:`Cada herramienta mira la infraestructura desde un ángulo distinto. Combinarlas da una imagen más completa.`,p:[`<b>VirusTotal:</b> reputación y relaciones de hashes, URL y dominios.`,`<b>Shodan y Censys:</b> servicios expuestos en internet.`,`<b>URLScan.io:</b> análisis de sitios web y sus recursos.`,`<b>crt.sh:</b> búsqueda de certificados TLS.`],q:[[`¿Para qué se usa Shodan?`,`Para encontrar servicios expuestos en internet.`],[`¿Qué puede mostrar crt.sh sobre un dominio?`,`Los certificados TLS emitidos para ese dominio y sus variantes.`]]},
{t:`Análisis de campañas`,c:`Una campaña agrupa incidentes que comparten un mismo actor, técnicas o infraestructura. Agruparlos permite ver el patrón completo, no solo eventos sueltos.`,p:[`Agrupar por TTP, infraestructura, víctimas y período.`,`Un solo punto en común no basta: buscá al menos dos coincidencias independientes.`,`Registrá qué incidentes quedaron fuera del grupo y por qué.`],q:[[`¿Cuántos puntos en común conviene exigir para agrupar incidentes en una campaña?`,`Al menos dos coincidencias independientes.`],[`¿Qué es agrupar incidentes en una campaña?`,`Relacionar eventos que comparten actor, técnicas o infraestructura para ver el patrón completo.`]]},

{t:`Atribución: niveles de confianza`,c:`Atribuir es decir quién está detrás de un ataque. Es el área con más errores, porque los atacantes pueden imitar a otros, y conviene separar evidencia de hipótesis.`,p:[`Distinguí entre hechos observados e interpretación.`,`Una falsa bandera es un ataque diseñado para parecer de otro actor.`,`Expresá la atribución con un nivel de confianza explícito (bajo, medio o alto).`],q:[[`¿Qué es una falsa bandera?`,`Un ataque diseñado para parecer de otro actor.`],[`¿Cómo conviene expresar una atribución?`,`Con un nivel de confianza explícito, separando evidencia de hipótesis.`]]}

const KEY='ruta-ti-v1', NKEY='ruta-ti-notas', VKEY='ruta-ti-view';
function load(k,d){ try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function store(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} if (k === KEY || k === NKEY) sbDirty(); }
let progress = load(KEY, {});
let notas = load(NKEY, {});
let view = load(VKEY, {phase:'f1', tab:'temas'});
if (!R.phases.some(p=>p.id===view.phase)) view = {phase:'f1', tab:'temas'};

const phases = R.phases;
const total = phases.reduce((a,p)=>a+p.temas.length+p.labs.length,0);
const pct = (d,n)=> n ? Math.round(d/n*100) : 0;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const doneTotal = ()=> Object.keys(progress).filter(k=>progress[k] && !k.endsWith('-w')).length;
function phaseCounts(p){
  let d = 0;
  p.temas.forEach((_,i)=>{ if (progress[p.id+'-t-'+i]) d++; });
  p.labs.forEach((_,i)=>{ if (progress[p.id+'-l-'+i]) d++; });
  return {d, n: p.temas.length + p.labs.length};
}
const chevron = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function quiz(qs){
  if (!qs || !qs.length) return '';
  return `<div class="quiz"><h4>Preguntas de repaso</h4><ol>${qs.map(([q,a])=>`<li><p>${q}</p><details><summary>Ver respuesta</summary><p>${a}</p></details></li>`).join('')}</ol></div>`;
}

function card(key, i, title, body){
  const done = !!progress[key];
  const wip = !!progress[key+'-w'];
  return `<article class="card ${done?'done':''} ${wip&&!done?'wip':''}" data-card="${key}">
  <div class="card-head">
    <label class="check"><input type="checkbox" data-k="${key}" aria-label="Marcar como hecho: ${esc(title)}" ${done?'checked':''}></label>
    <button class="card-toggle" type="button" aria-expanded="false" aria-controls="b-${key}" data-toggle="${key}">
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <span class="card-title">${title}</span>
      ${chevron}
    </button>
    <button class="wip-btn" type="button" aria-pressed="${wip}" data-wip="${key}">En curso</button>
  </div>
  <div class="card-body" id="b-${key}" hidden>${body}<div class="notes"><label class="mono" for="n-${key}">Mis notas</label><textarea id="n-${key}" data-note="${key}" rows="3" placeholder="Conclusiones, dudas, fuentes...">${esc(notas[key]||'')}</textarea></div></div>
</article>`;
}

function herrPanel(p){
  const lista = p.herr || [];
  return `<p class="intro">Descargá solo desde el sitio o repositorio oficial. Algunas herramientas tienen planes gratuitos con límites; revisalos antes de usarlas.</p><div class="res-grid">${lista.map(h=>`<a class="res-card" href="${h[2]}" target="_blank" rel="noopener"><span class="mono">${h[3]}</span><b>${h[0]}</b><span class="res-desc">${h[1]}</span><span class="res-link">${h[2].replace(/^https?:\/\//,'').replace(/\/$/,'')} ↗</span></a>`).join('')}</div>`;
}

function pager(p){
  const i = phases.findIndex(x=>x.id===p.id);
  const prev = phases[i-1], next = phases[i+1];
  return `<nav class="pager" aria-label="Cambiar de fase">${prev?`<button class="reset" type="button" data-phase="${prev.id}">← ${prev.n}: ${prev.name}</button>`:'<span></span>'}${next?`<button class="reset" type="button" data-phase="${next.id}">${next.n}: ${next.name} →</button>`:'<span></span>'}</nav>`;
}

function renderAside(){
  const d = doneTotal();
  const items = phases.map(p=>{
    const c = phaseCounts(p);
    return `<button class="nav-item" type="button" data-phase="${p.id}" aria-current="${view.phase===p.id}">
      <span class="nav-top"><span class="nav-name">${p.n}: ${p.name}</span><span class="mono" data-nav-count="${p.id}">${c.d}/${c.n}</span></span>
      <span class="pbar"><span data-nav-bar="${p.id}" style="width:${pct(c.d,c.n)}%"></span></span>
    </button>`;
  }).join('');
  return `
  <div>
    <a class="back" href="../">← Todas las rutas</a>
    <p class="brand" style="margin-top:12px">Threat Intelligence</p>
    <p class="mono" style="margin-top:4px">Nivel 2 · 3 fases</p>
  </div>
  <div class="overall">
    <div class="mono" id="overall-text">${d} de ${total} completados · ${pct(d,total)}%</div>
    <div class="pbar"><span id="overall-bar" style="width:${pct(d,total)}%"></span></div>
  </div>
  <label class="aside-search"><span class="mono">Buscar en la ruta</span><input id="qsearch" type="search" placeholder="Tema, laboratorio o término" value="${esc(view.q||'')}"></label>
  <nav class="nav" aria-label="Fases">${items}</nav>
  <div class="aside-foot">
    <div class="sync-box" id="sync-box">${syncBoxHtml()}</div>
    <button class="reset" type="button" id="export">Exportar progreso</button>
    <button class="reset" type="button" id="import">Importar progreso</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <button class="reset" type="button" id="reset">Reiniciar progreso</button>
    <span class="mono">Tu progreso se guarda en este navegador.</span>
  </div>`;
}

function renderSearch(){
  const q = view.q.trim().toLowerCase();
  const hits = [];
  phases.forEach(p=>{
    p.temas.forEach(x=>{
      if ((x.t+' '+x.c+' '+(x.p||[]).join(' ')).toLowerCase().includes(q)) hits.push({where:`${p.n} · Temas`, t:x.t, go:`${p.id}|temas`});
    });
    p.labs.forEach(l=>{
      if ((l.t+' '+l.pasos.join(' ')).toLowerCase().includes(q)) hits.push({where:`${p.n} · Laboratorios`, t:l.t, go:`${p.id}|labs`});
    });
  });
  const list = hits.length
    ? hits.map(h=>`<button class="s-item" type="button" data-goto="${h.go}"><span class="mono">${h.where}</span><b>${h.t}</b></button>`).join('')
    : `<p class="intro">No encontré resultados para “${esc(view.q)}”.</p>`;
  return `<div class="wrap"><section class="hero"><span class="mono">Búsqueda</span><h1>${hits.length} resultado${hits.length===1?'':'s'}</h1><p>Hacé clic en un resultado para abrirlo.</p></section><div class="s-list">${list}</div></div>`;
}

function renderMain(){
  if (view.q && view.q.trim()) return renderSearch();
  const p = phases.find(x=>x.id===view.phase);
  const c = phaseCounts(p);
  const tabs = [['temas','Temas',p.temas.length],['labs','Laboratorios',p.labs.length],['herramientas','Herramientas',(p.herr||[]).length],['recursos','Recursos',p.recursos.length]];
  const seg = tabs.map(([k,l,n])=>`<button type="button" role="tab" aria-selected="${view.tab===k}" data-tab="${k}">${l} · ${n}</button>`).join('');
  let panel = '';
  if (view.tab === 'temas') {
    panel = p.temas.map((x,i)=>card(p.id+'-t-'+i, i, x.t, `<p>${x.c}</p>${x.p?`<ul>${x.p.map(q=>`<li>${q}</li>`).join('')}</ul>`:''}${quiz(x.q)}`)).join('');
  } else if (view.tab === 'labs') {
    panel = p.labs.map((l,i)=>card(p.id+'-l-'+i, i, l.t, `<ol class="steps">${l.pasos.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>`)).join('');
  } else if (view.tab === 'herramientas') {
    panel = herrPanel(p);
  } else {
    panel = `<div class="res-grid">${p.recursos.map(r=>`<a class="res-card" href="${r[2]}" target="_blank" rel="noopener"><b>${r[0]}</b><span class="res-desc">${r[1]}</span><span class="res-link">${r[2].replace(/^https?:\/\//,'').replace(/\/$/,'')} ↗</span></a>`).join('')}</div>`;
  }
  return `<div class="wrap">
  <section class="hero">
    <span class="mono">${p.n} · ${p.weeks}</span>
    <h1>${p.name}</h1>
    <p>${p.goal}</p>
    <div class="hero-prog"><div class="pbar"><span id="hero-bar" style="width:${pct(c.d,c.n)}%"></span></div><span class="mono" id="hero-text">${c.d} de ${c.n}</span></div>
  </section>
  <div class="seg" role="tablist" aria-label="Contenido de la fase">${seg}</div>
  <div role="tabpanel">${panel}</div>
  ${pager(p)}
  <div class="note"><strong>Regla básica:</strong> analizá amenazas solo con fuentes públicas o autorizadas. Acceder a sistemas de terceros es delito en Colombia (Ley 1273 de 2009).</div>
  </div>`;
}

function renderAll(){
  document.getElementById('app').innerHTML = `<div class="app"><aside>${renderAside()}</aside><main id="main" tabindex="-1">${renderMain()}</main></div>`;
}

function updateCounts(){
  const d = doneTotal();
  const ob = document.getElementById('overall-bar'); if (ob) ob.style.width = pct(d,total)+'%';
  const ot = document.getElementById('overall-text'); if (ot) ot.textContent = `${d} de ${total} completados · ${pct(d,total)}%`;
  phases.forEach(p=>{
    const c = phaseCounts(p);
    const nb = document.querySelector(`[data-nav-bar="${p.id}"]`); if (nb) nb.style.width = pct(c.d,c.n)+'%';
    const nc = document.querySelector(`[data-nav-count="${p.id}"]`); if (nc) nc.textContent = `${c.d}/${c.n}`;
  });
  const cur = phases.find(x=>x.id===view.phase);
  if (cur) {
    const c = phaseCounts(cur);
    const hb = document.getElementById('hero-bar'); if (hb) hb.style.width = pct(c.d,c.n)+'%';
    const ht = document.getElementById('hero-text'); if (ht) ht.textContent = `${c.d} de ${c.n}`;
  }
}

const root = document.getElementById('app');

root.addEventListener('input', e=>{
  const t = e.target;
  if (t.id === 'qsearch') {
    view.q = t.value;
    const mainEl = document.querySelector('main');
    if (mainEl) mainEl.innerHTML = renderMain();
    return;
  }
  if (t.dataset && t.dataset.note) { notas[t.dataset.note] = t.value; store(NKEY, notas); }
});

root.addEventListener('change', e=>{
  const input = e.target.closest('input[type=checkbox][data-k]');
  if (!input) return;
  progress[input.dataset.k] = input.checked;
  store(KEY, progress);
  const cardEl = input.closest('.card');
  if (cardEl) cardEl.classList.toggle('done', input.checked);
  updateCounts();
});

root.addEventListener('click', e=>{
  const gotoBtn = e.target.closest('[data-goto]');
  if (gotoBtn) {
    const [ph, tab] = gotoBtn.dataset.goto.split('|');
    view = {phase: ph, tab: tab === 'labs' ? 'labs' : 'temas', q: ''};
    store(VKEY, {phase: view.phase, tab: view.tab}); renderAll(); return;
  }
  const wipBtn = e.target.closest('[data-wip]');
  if (wipBtn) {
    const k = wipBtn.dataset.wip + '-w';
    progress[k] = !progress[k];
    store(KEY, progress);
    wipBtn.setAttribute('aria-pressed', String(!!progress[k]));
    const cardEl = wipBtn.closest('.card');
    if (cardEl) cardEl.classList.toggle('wip', !!progress[k] && !progress[wipBtn.dataset.wip]);
    return;
  }
  const phaseBtn = e.target.closest('[data-phase]');
  if (phaseBtn) {
    view = {phase: phaseBtn.dataset.phase, tab: 'temas', q: ''};
    store(VKEY, {phase: view.phase, tab: view.tab}); renderAll(); return;
  }
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) {
    view.tab = tabBtn.dataset.tab;
    store(VKEY, {phase: view.phase, tab: view.tab}); renderAll(); return;
  }
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    const body = document.getElementById('b-'+toggle.dataset.toggle);
    const open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    if (body) body.hidden = open;
    return;
  }
  const reset = e.target.closest('#reset');
  if (reset) {
    if (reset.dataset.armed === '1') {
      progress = {}; store(KEY, progress); renderAll();
    } else {
      reset.dataset.armed = '1';
      reset.textContent = 'Confirmar reinicio';
      setTimeout(()=>{ reset.dataset.armed = ''; reset.textContent = 'Reiniciar progreso'; }, 4000);
    }
  }
});

// Exportar e importar progreso (copia de seguridad en JSON)
const BACKUP_APP = 'threat-intelligence';
const BACKUP_STATE = () => ({progreso:progress,notas:notas});
document.addEventListener('click', e => {
  if (e.target.closest('#export')) {
    const data = {app: BACKUP_APP, version: 1, fecha: new Date().toISOString(), datos: BACKUP_STATE()};
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = BACKUP_APP + '-progreso-' + data.fecha.slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } else if (e.target.closest('#import')) {
    const inp = document.getElementById('import-file'); if (inp) inp.click();
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'import-file' || !e.target.files[0]) return;
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const d = data && data.datos;
      if (!data || data.app !== BACKUP_APP || !d || typeof d.progreso !== 'object' || d.progreso === null) throw new Error('formato');
      if (!confirm('Esto reemplaza tu progreso y tus notas actuales en este navegador. ¿Continuar?')) return;
      progress = d.progreso || {};
      notas = (d.notas && typeof d.notas === 'object') ? d.notas : {};
      store(KEY, progress); store(NKEY, notas);
      renderAll();
    } catch (err) {
      alert('El archivo no es una copia de seguridad válida de esta ruta.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
// Sincronización opcional con Supabase (inicio de sesión por enlace al correo).
// Sin sesión todo sigue funcionando solo con localStorage.
const SB_URL = 'https://wavrteveawmympridvbp.supabase.co';
const SB_KEY = 'sb_publishable_MHeWlA3ZUeJC3sa4X5mNPA_hbHQXp7v'; // clave pública; los datos los protege RLS
const SB_RUTA = 'threat-intelligence';
const SB_META = 'ruta-ti-sync';
let sb = null, sbUser = null, sbMsg = '', sbBusy = false, sbTimer = null, sbApplying = false, sbForm = false;
let sbMeta = {};
try { sbMeta = JSON.parse(localStorage.getItem(SB_META) || '{}') || {}; } catch (e) { sbMeta = {}; }
function sbSaveMeta(){ try { localStorage.setItem(SB_META, JSON.stringify(sbMeta)); } catch (e) {} }
function sbGet(){ return {progreso: progress, notas: notas, config: {}}; }
function sbSet(s){ sbApplying = true; try { progress = s.progreso || {}; notas = s.notas || {}; store(KEY, progress); store(NKEY, notas); } finally { sbApplying = false; } }
function sbDirty(){
  if (sbApplying) return;
  sbMeta.dirty = true; sbSaveMeta();
  if (sbUser) { clearTimeout(sbTimer); sbTimer = setTimeout(sbPush, 1500); }
}
function sbBox(){
  const box = document.getElementById('sync-box');
  if (box) box.innerHTML = syncBoxHtml();
}
function syncBoxHtml(){
  if (!sb) return '';
  const msg = sbMsg ? '<span class="sync-msg" role="status">' + esc(sbMsg) + '</span>' : '';
  if (sbUser) return '<span class="mono">Sincronizado como ' + esc(sbUser.email || '') + '</span>' + msg + '<button class="reset" type="button" id="sync-out">Cerrar sesión</button>';
  if (sbForm) return '<form id="sync-form" class="sync-box"><label class="start-field"><span class="mono">Tu correo</span><input type="email" id="sync-email" required autocomplete="email" placeholder="nombre@correo.com"></label><button class="reset" type="submit">Enviarme el enlace</button></form>' + msg + '<span class="sync-msg">Se guardan tu correo, tu progreso y tus notas en Supabase.</span>';
  return '<button class="reset" type="button" id="sync-open">Iniciar sesión para sincronizar</button>' + msg;
}
function sbMerge(l, r){
  // En conflicto gana lo local; lo que solo existe en la nube se conserva.
  return {progreso: Object.assign({}, r.progreso, l.progreso), notas: Object.assign({}, r.notas, l.notas), config: Object.assign({}, r.config, l.config)};
}
async function sbPush(){
  if (!sb || !sbUser || sbBusy) return;
  sbBusy = true;
  const s = sbGet();
  try {
    const {data, error} = await sb.from('progreso').upsert(
      {user_id: sbUser.id, ruta: SB_RUTA, progreso: s.progreso, notas: s.notas, config: s.config},
      {onConflict: 'user_id,ruta'}).select('updated_at');
    if (error || !data || !data[0]) throw error || new Error('sin datos');
    sbMeta = {uid: sbUser.id, at: data[0].updated_at, dirty: false}; sbSaveMeta();
    sbMsg = 'Guardado en la nube.';
  } catch (e) {
    sbMsg = 'No se pudo guardar. Reintento en unos segundos.';
    clearTimeout(sbTimer); sbTimer = setTimeout(sbPush, 30000);
  } finally { sbBusy = false; sbBox(); }
}
async function sbPull(){
  if (!sb || !sbUser) return;
  try {
    const {data, error} = await sb.from('progreso').select('progreso,notas,config,updated_at').eq('ruta', SB_RUTA).maybeSingle();
    if (error) throw error;
    const linked = sbMeta.uid === sbUser.id && sbMeta.at;
    if (!data) { sbMeta = {uid: sbUser.id, dirty: true}; sbSaveMeta(); await sbPush(); return; }
    if (linked && sbMeta.at === data.updated_at) {
      if (sbMeta.dirty) await sbPush(); else { sbMsg = 'Todo al día.'; sbBox(); }
      return;
    }
    const remote = {progreso: data.progreso || {}, notas: data.notas || {}, config: data.config || {}};
    if (linked && !sbMeta.dirty) {
      sbSet(remote); sbMeta = {uid: sbUser.id, at: data.updated_at, dirty: false}; sbSaveMeta();
      sbMsg = 'Cargamos tu progreso guardado.'; renderAll();
    } else {
      sbSet(sbMerge(sbGet(), remote)); sbMeta = {uid: sbUser.id, at: data.updated_at, dirty: true}; sbSaveMeta();
      sbMsg = 'Combinamos tu progreso de este equipo con el guardado.'; renderAll(); await sbPush();
    }
  } catch (e) { sbMsg = 'No se pudo conectar con la nube. Tu progreso local está a salvo.'; sbBox(); }
}
function sbInit(){
  if (!window.supabase) return;
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  sb.auth.onAuthStateChange((ev, session) => {
    sbUser = session ? session.user : null;
    sbBox();
    if (sbUser && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(sbPull, 0);
  });
  sbBox();
}
document.addEventListener('click', async e => {
  if (!sb) return;
  if (e.target.closest('#sync-open')) { sbForm = true; sbMsg = ''; sbBox(); const i = document.getElementById('sync-email'); if (i) i.focus(); }
  else if (e.target.closest('#sync-out')) { clearTimeout(sbTimer); await sb.auth.signOut(); sbMsg = 'Sesión cerrada. Tu progreso sigue en este navegador.'; sbBox(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'sync-form' || !sb) return;
  e.preventDefault();
  const email = document.getElementById('sync-email').value.trim();
  sbMsg = 'Enviando…'; sbBox();
  const {error} = await sb.auth.signInWithOtp({email: email, options: {emailRedirectTo: location.origin + location.pathname}});
  sbForm = !!error;
  sbMsg = error ? 'No se pudo enviar el enlace. Esperá unos minutos e intentá de nuevo.' : 'Listo: abrí el enlace que te enviamos al correo.';
  sbBox();
});
(function(){
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
  s.integrity = 'sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug';
  s.crossOrigin = 'anonymous';
  s.onload = sbInit;
  document.head.appendChild(s);
})();

renderAll();
</script>
